# Pubblica la web app di Quizzometro su GitHub Pages a ogni push sul ramo principale.
name: Pubblica web app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizzometro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa le dipendenze
        run: |
          # il lockfile creato su Replit punta al registro interno di Replit: qui usiamo quello pubblico
          sed -i 's#http://package-firewall.replit.internal/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --no-fund
      - name: Compila la web app
        env:
          WEB_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web --output-dir dist
          node -e "require('fs').writeFileSync('dist/version.json', JSON.stringify({version: require('./app.json').expo.version}))"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quizzometro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
